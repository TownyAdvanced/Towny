before_install:
    # Make sure SDKMAN is addressable and up-to-date.
    - source "$HOME/.sdkman/bin/sdkman-init.sh"
    - sdk update
    # Use Eclipse Temurin 25 builds
    - sdk install java 25-tem
    - sdk use java 25-tem
    # Use a modern Maven binary
    - sdk install maven 3.9.9
    - sdk use maven 3.9.9
